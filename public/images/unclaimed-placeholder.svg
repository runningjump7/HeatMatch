<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f3f4f6"/>

  <!-- Simple building icon -->
  <g transform="translate(200, 150)">
    <!-- Main building shape -->
    <rect x="-50" y="-40" width="100" height="80" fill="none" stroke="#d1d5db" stroke-width="3"/>

    <!-- Windows -->
    <rect x="-35" y="-30" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>
    <rect x="-5" y="-30" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>
    <rect x="25" y="-30" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>

    <rect x="-35" y="-5" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>
    <rect x="-5" y="-5" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>
    <rect x="25" y="-5" width="15" height="15" fill="none" stroke="#d1d5db" stroke-width="2"/>

    <!-- Door -->
    <rect x="-15" y="15" width="30" height="25" fill="none" stroke="#d1d5db" stroke-width="2"/>

    <!-- Roof -->
    <polygon points="-50,-40 0,-65 50,-40" fill="none" stroke="#d1d5db" stroke-width="3"/>
  </g>

  <!-- "Unclaimed" text -->
  <text x="200" y="260" font-size="16" font-weight="500" text-anchor="middle" fill="#9ca3af">Unclaimed</text>
</svg>